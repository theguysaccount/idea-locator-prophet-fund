# Tests on every push and pull request: data validation, ledger integrity, resolvers, the build, the browser scripts.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python tests
        run: python -m unittest discover -s tests -t . -v
      - name: Build
        run: python -m il.site
      - name: Browser-script tests
        run: node --test tests/js.test.mjs
